<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGL2 - Multiple Objects - list optimized</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }
        canvas {
            /*width: 100vw;*/
            /*height: 100vh;*/
            width: 400px;
            height: 300px;
            display: block;
        }
        .description {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
        }
    </style>

</head>
<body>
<div class="description">
    Draw multiple objects by list with optimization checks
</div>
<script src="https://webgl2fundamentals.org/webgl/resources/twgl-full.min.js"></script>
<script src="https://webgl2fundamentals.org/webgl/resources/m4.js"></script>
<script src="https://webgl2fundamentals.org/webgl/resources/flattened-primitives.js"></script>
<script src="https://webgl2fundamentals.org/webgl/resources/chroma.min.js"></script>
<script src="https://webgl2fundamentals.org/webgl/resources/webgl-utils.js"></script>
<script src="./resources/webgl-lessons-ui.js"></script>

<canvas id="canvas"></canvas>
<div id="uiContainer">
    <div id="ui">
        <div id="x"></div>
        <div id="y"></div>
        <div id="z"></div>
        <div id="rotate_x"></div>
        <div id="rotate_y"></div>
        <div id="rotate_z"></div>
    </div>
</div>
<div id="error-box">
    <span class="error-box-title">ERROR MESSAGES if any, go in here.</span>
</div>

</body>
</html>
